name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint the web backend (server/) — black, isort, flake8.
  # Scoped to server/ on purpose: the legacy desktop code under modules/ was
  # never auto-formatted, and mypy is too noisy across the transitive imports.
  # ─────────────────────────────────────────────
  lint:
    name: Lint (web backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install black isort flake8

      - name: black --check
        run: black --check server/

      - name: isort --check
        run: isort --check-only server/

      - name: flake8
        run: |
          flake8 server/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503

  # ─────────────────────────────────────────────
  # Job 2: Core unit tests (no Qt, no PaddleOCR)
  # 3.10 is what the GPU images run (Ubuntu 22.04) and the supported floor;
  # 3.12 is what the CPU images run.
  # ─────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov numpy pyyaml

      - name: Run unit tests (headless, no Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/unit/ \
            -m "not gui and not slow" \
            --tb=short \
            -q \
            --cov=modules/core \
            --cov=modules/utils \
            --cov=modules/config \
            --cov-report=term-missing \
            --cov-fail-under=30

  # ─────────────────────────────────────────────
  # Job 3: Web backend API tests (FastAPI TestClient, no paddle/Qt)
  # ─────────────────────────────────────────────
  backend-api:
    name: Backend API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight web test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run web API round-trip tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_api_server.py --tb=short -q

  # ─────────────────────────────────────────────
  # Job 4: Frontend (type-check + build + Vitest)
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm run test

  # ─────────────────────────────────────────────
  # Job 5: Docker builds (CPU images)
  # Runs on pull requests too: with the layer cache, a change that leaves the
  # dependency layers alone builds in under a minute, and a Dockerfile change
  # is then tested before it merges instead of after. Pull requests read the
  # cache but never write it, so they cannot evict main's layers.
  # The desktop image is built so it cannot drift again unnoticed (it was
  # still installing PaddlePaddle 2.6 next to a 3.x requirement).
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web, CPU
            file: Dockerfile.web
            target: runtime-web
            scope: web-cpu
          - name: desktop, CPU
            file: Dockerfile
            target: runtime-cpu
            scope: desktop-cpu
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.scope) || '' }}
